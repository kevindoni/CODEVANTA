name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov mypy
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: python -m pytest --cov=codevanta --cov-report=term-missing

  type-check:
    name: type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" mypy pytest-cov
      - name: Type-check
        run: python -m mypy

  package:
    name: build and smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/codevanta --help
          .venv-wheel/bin/codevanta mcp --help
      - name: Check wheel layout
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          tops = {name.split("/")[0] for name in names}
          bad = [top for top in tops if not top.startswith("codevanta")]
          assert not bad, f"unexpected top-level packages: {bad}"
          assert "codevanta/cli/main.py" in names
          assert any(name.endswith("LICENSE") for name in names)
          print("wheel layout ok")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Proves the provider layer against a REAL decompiler instead of the native
  # fallback: `.[decompilers]` installs angr (heavy, hence its own job and not
  # part of `dev`), and tests/test_decompiler_parity.py fails -- it does not
  # skip -- when angr is importable but the layer does not use it.
  decompile-parity:
    name: decompile-parity
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.12: angr publishes cp312 wheels, so the job installs from wheels
          # instead of building angr's C extensions from source.
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,decompilers]"
      - name: Report the available decompiler backends
        run: python scripts/check_decompiler_backends.py
      - name: Decompiler parity
        run: python -m pytest tests/test_decompiler_parity.py tests/test_solver.py -q

  # SECOND real provider, and deliberately BEST EFFORT. Unlike angr (pure wheels),
  # the ghidra backend needs two things this repository does not own: a ~570 MB
  # Ghidra release from GitHub and a JDK. A flaky download or a JVM hiccup must
  # never block a merge, so `continue-on-error: true` keeps the job informative --
  # the blocking gate for the provider layer stays `decompile-parity` (angr).
  # The job is honest in the other direction too: if Ghidra cannot be fetched it
  # prints a ::notice:: line saying the backend was NOT exercised, because a green
  # job that silently skipped the work would be worse than a yellow one that says so.
  ghidra-parity:
    name: ghidra-parity
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Pinned on purpose, and pinned as a *pair*: Ghidra 12.1 requires JDK 21
      # (Ghidra 12.2 already requires JDK 25) and pyghidra 3.x requires Ghidra
      # >= 12.0, so 12.1 + Temurin 21 is the newest combination that matches the
      # JDK pinned below. GHIDRA_SHA256 is the checksum published in the release
      # notes, so a corrupted cache entry or a truncated download is caught here
      # instead of surfacing as a confusing decompiler error.
      GHIDRA_VERSION: "12.1"
      GHIDRA_ASSET: "ghidra_12.1_PUBLIC_20260513.zip"
      GHIDRA_SHA256: "aa5cbcbbf48f41ca185fce900e19592f1ade4cd5994eb6e0ede468dac8a6f302"
      GHIDRA_URL: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1_build/ghidra_12.1_PUBLIC_20260513.zip"
      GHIDRA_ZIP_DIR: ${{ github.workspace }}/.ghidra-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.12: angr publishes cp312 wheels and Ghidra 12.1 supports Python
          # 3.9-3.14 for PyGhidra mode, so every dependency installs from a wheel.
          python-version: "3.12"
          cache: pip
      - name: Set up JDK 21 (pyghidra starts Ghidra's JVM inside CPython)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the cached Ghidra release (~570 MB, so caching matters)
        uses: actions/cache@v4
        with:
          path: .ghidra-cache
          key: ghidra-${{ env.GHIDRA_ASSET }}
      - name: Download and unpack Ghidra ${{ env.GHIDRA_VERSION }}
        id: ghidra
        run: |
          set -uo pipefail
          archive="$GHIDRA_ZIP_DIR/$GHIDRA_ASSET"
          mkdir -p "$GHIDRA_ZIP_DIR"
          # A cache hit that fails the published checksum is worse than a miss.
          if [ -f "$archive" ] && ! echo "$GHIDRA_SHA256  $archive" | sha256sum -c - >/dev/null 2>&1; then
            echo "cached $GHIDRA_ASSET does not match the published SHA-256; re-downloading it"
            rm -f "$archive"
          fi
          if [ ! -f "$archive" ]; then
            if curl -fSL --retry 3 --retry-delay 5 --connect-timeout 20 -o "$archive.part" "$GHIDRA_URL"; then
              mv "$archive.part" "$archive"
            else
              rm -f "$archive.part"
              echo "::warning::Ghidra $GHIDRA_VERSION could not be downloaded from $GHIDRA_URL"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if ! echo "$GHIDRA_SHA256  $archive" | sha256sum -c -; then
            echo "::warning::$GHIDRA_ASSET does not match the published SHA-256"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf .ghidra-install
          if ! unzip -q "$archive" -d .ghidra-install; then
            echo "::warning::could not unpack $GHIDRA_ASSET"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install_dir=$(find .ghidra-install -maxdepth 2 -name ghidraRun -printf '%h\n' | head -n1)
          if [ -z "$install_dir" ]; then
            echo "::warning::the $GHIDRA_ASSET archive did not contain a ghidraRun launcher"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "GHIDRA_INSTALL_DIR=$PWD/$install_dir" >> "$GITHUB_ENV"
          echo "Ghidra $GHIDRA_VERSION unpacked at $PWD/$install_dir"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Say out loud that Ghidra was not exercised
        if: steps.ghidra.outputs.ok != 'true'
        run: |
          echo "::notice::Ghidra $GHIDRA_VERSION was not available, so the ghidra backend was NOT exercised in this run; this job is best effort and never blocks a merge."
      # `decompilers` carries both providers (angr and pyghidra). angr has to be
      # installed even here because tests/test_decompiler_parity.py skips the whole
      # module without it -- and a skipped module would let `-k ghidra` pass while
      # running nothing, which is precisely the kind of lie this job exists to avoid.
      - name: Install with the decompilers extra (angr + pyghidra)
        if: steps.ghidra.outputs.ok == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,decompilers]"
      - name: Assert the probe reports the ghidra backend available
        if: steps.ghidra.outputs.ok == 'true'
        run: |
          set -euo pipefail
          python scripts/check_decompiler_backends.py | tee backends.txt
          if ! grep -Eq '^ghidra[[:space:]]+available' backends.txt; then
            echo "::error::Ghidra $GHIDRA_VERSION is unpacked but the probe still reports the ghidra backend unavailable"
            exit 1
          fi
      - name: Ghidra decompiler parity
        if: steps.ghidra.outputs.ok == 'true'
        run: python -m pytest tests/test_decompiler_parity.py -q -k ghidra

  fuzz-smoke:
    name: fuzz smoke (parser hardening)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mutational fuzz over the committed samples
        run: python scripts/fuzz_parsers.py --iterations 30 --seed 3
      - name: Fuzz tests
        run: python -m pytest tests/test_fuzz_parsers.py -q

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Timings are machine-dependent: this job reports drift, it does not gate.
      - name: Benchmark against the committed baseline (wide tolerance)
        run: python scripts/bench_gate.py --repeat 1 --tolerance 3.0
      - name: Benchmark gate tests
        run: python -m pytest tests/test_bench_gate.py -q

  # Windows and macOS run the same suite as platform signal, not gates: parity
  # is proven by the Linux `test` job, so these runs never block a merge.
  test-platform:
    name: test (py3.13, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov mypy
      - name: Test
        run: python -m pytest --cov=codevanta --cov-report=term-missing

