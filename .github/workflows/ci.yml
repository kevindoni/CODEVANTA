name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest

  package:
    name: build and smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/codevanta --help
          .venv-wheel/bin/codevanta mcp --help
      - name: Check wheel layout
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          tops = {name.split("/")[0] for name in names}
          bad = [top for top in tops if not top.startswith("codevanta")]
          assert not bad, f"unexpected top-level packages: {bad}"
          assert "codevanta/cli/main.py" in names
          assert any(name.endswith("LICENSE") for name in names)
          print("wheel layout ok")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
