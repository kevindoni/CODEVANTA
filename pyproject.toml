[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codevanta"
version = "0.1.0"
description = "CODEVANTA — Advanced Code Intelligence: AI-Powered Reverse Engineering & Binary Analysis Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kevindoni" }]
keywords = ["reverse-engineering", "binary-analysis", "disassembly", "security", "pe", "elf", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "lief>=0.14",
  "capstone>=5.0",
  "typer>=0.12",
  "rich>=13.0",
  "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/kevindoni/CODEVANTA"
Repository = "https://github.com/kevindoni/CODEVANTA"
Issues = "https://github.com/kevindoni/CODEVANTA/issues"
Documentation = "https://github.com/kevindoni/CODEVANTA/blob/main/docs/install.md"
Changelog = "https://github.com/kevindoni/CODEVANTA/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "tomli>=2.0; python_version < '3.11'",
  "ruff>=0.5",
  "build>=1.2",
  "unicorn>=2.0",
]
emulation = [
  "unicorn>=2.0",
]
# Real decompiler providers. Deliberately NOT part of `dev`: angr is heavy, so only
# the `decompile-parity` CI job installs it. `pip install -e ".[decompilers]"` is
# the local equivalent and makes `codevanta.analysis.decompilers` prefer angr.
decompilers = [
  "angr>=9.2",
]

[project.scripts]
codevanta = "codevanta.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["codevanta*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["codevanta"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.10"
files = ["src/codevanta", "scripts"]
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
